# Azure DevOps pipeline: Playwright (TS) + C# API suite + k6 performance.
# Each stage publishes its results to the Tests tab, so failures, flaky tests and
# trends are visible in Azure DevOps without opening logs.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

schedules:
  - cron: '0 3 * * *'          # nightly full regression + performance
    displayName: Nightly
    branches:
      include: [main]
    always: true

variables:
  - name: API_URL
    value: 'https://petstore.swagger.io/v2/'
  # On a real project: environment URLs and secrets come from a variable group
  # (optionally linked to Azure Key Vault), never from the repo.
  # - group: vetclinic-test-env

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Playwright
    displayName: Playwright UI + API (TypeScript)
    jobs:
      - job: playwright
        timeoutInMinutes: 30
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            workingDirectory: playwright
            displayName: Install dependencies

          - script: npx playwright install --with-deps chromium firefox
            workingDirectory: playwright
            displayName: Install browsers

          - script: npx playwright test
            workingDirectory: playwright
            displayName: Run Playwright tests
            env:
              CI: 'true'
              API_URL: $(API_URL)

          - task: PublishTestResults@2
            displayName: Publish Playwright results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: playwright/test-results/junit.xml
              testRunTitle: Playwright $(Build.BuildNumber)
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            displayName: Publish HTML report + traces
            condition: succeededOrFailed()
            inputs:
              targetPath: playwright/playwright-report
              artifact: playwright-report-$(System.JobAttempt)

  - stage: CSharpApi
    displayName: C# API suite (Refit + RestSharp)
    dependsOn: []               # runs in parallel with the Playwright stage
    jobs:
      - job: dotnet
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '8.x'

          - script: dotnet test api-csharp/VetApi.Tests.csproj --settings api-csharp/test.runsettings --logger "trx;LogFileName=api.trx" --results-directory $(Agent.TempDirectory)/TestResults
            displayName: Run C# API tests
            env:
              API_URL: $(API_URL)

          - task: PublishTestResults@2
            displayName: Publish C# results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
              testRunTitle: C# API $(Build.BuildNumber)
              failTaskOnFailedTests: true

  - stage: Performance
    displayName: k6 performance
    dependsOn: [Playwright, CSharpApi]
    # Only on the nightly schedule or when started manually – never on every PR.
    condition: and(succeeded(), in(variables['Build.Reason'], 'Schedule', 'Manual'))
    jobs:
      - job: k6
        steps:
          - script: |
              sudo gpg -k
              sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
              echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update && sudo apt-get install -y k6
            displayName: Install k6

          - script: k6 run --summary-export=$(Build.ArtifactStagingDirectory)/k6-summary.json performance/patients-load.js
            displayName: Run load test (thresholds fail the stage)
            env:
              API_URL: https://petstore.swagger.io/v2

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/k6-summary.json
              artifact: k6-summary
